[package]
name = "win-driver"
description = "実機の手動確認で、テスト用のインスタンスを起動し、状態を待ち、値を読み、入力を送る道具（開発専用。zip には入れない）。使い方は docs/agents/manual-check.md"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
shunsoku-core = { path = "../../crates/shunsoku-core" }

# Linux では `cargo test --workspace` が通るように、Win32 の部分は Windows でだけ組む。
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
