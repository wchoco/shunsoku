[package]
name = "shunsoku"
description = "常駐本体"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
shunsoku-core = { path = "../shunsoku-core" }
shunsoku-pipe-identity = { path = "../shunsoku-pipe-identity" }
log = "0.4.35"

# Win32 層は Windows でだけ組む。Linux では `cargo test -p shunsoku-core` と
# `--target x86_64-pc-windows-msvc` の clippy で確かめる。
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Direct2D の点（`D2D_POINT_2F` = `Vector2`）の型。`windows` は再公開しないので、同じ版を直接使う。
[target.'cfg(windows)'.dependencies.windows-numerics]
version = "0.3.1"
