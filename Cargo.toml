[workspace]
resolver = "3"
members = [
    "crates/shunsoku-core",
    "crates/shunsoku",
    "crates/shunsoku-cli",
    "tools/perf-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# panic = "abort" にはしない。裏のスレッドのパニックをその仕事の失敗として扱い、常駐を続けるため（spec #32）。
[profile.release]
lto = true
codegen-units = 1
strip = true
