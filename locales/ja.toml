# UI の文言（日本語）。exe に include_str! で埋め込む。
# キーはテーブルを `.` でつないだもの（[tray.menu] の exit は tray.menu.exit）。
# 用語は GLOSSARY.md に従う。

[tray]
tooltip = "shunsoku"

[tray.menu]
select_capture = "範囲選択キャプチャ"
regions = "定型領域"
regions_empty = "（なし）"
add_region = "定型領域を追加…"
trash = "ごみ箱"
trash_empty = "（空）"
close_all = "すべてのスクラップを閉じる"
hide_all = "すべて隠す"
show_all = "すべて表示"
settings = "設定…"
exit = "終了"

[panic]
title = "shunsoku"
body = "予期しないエラーが起きたため、shunsoku を終了します。詳しくはログを見てください。"

[notify]
title = "shunsoku"

[settings]
unreadable = "設定ファイルを読めないため、既定値で起動しました。"
invalid_items = "不正な項目を既定値にしました: "
unreadable_kept = "設定ファイルを TOML として読めないため、直前の設定のまま動いています。"
conflicts = "重なったキーを、重なった項目のすべてで無効にしました: "
mouse_conflicts = "重なったマウス操作を、重なった項目のすべてで無効にしました: "
overlaps = "ホットキーとショートカットが重なっています（ホットキーが優先され、そのショートカットは効きません）: "
watch_stopped = "設定ファイルの監視が止まりました。設定ファイルを直したら shunsoku を起動し直してください。"

# 設定 GUI（ダイアログ）
[settings_gui]
title = "shunsoku の設定"
# ダイアログの文字のフォント（DS_SETFONT の書体名）
font = "Yu Gothic UI"
ok = "OK"
cancel = "キャンセル"
apply = "適用"
write_failed = "設定ファイルに書けませんでした。設定 GUI の内容はまだ適用されていません。"

# 適用で、設定 GUI を開いている間に設定ファイルでも変わった項目を GUI でも変えていたときの確認
[settings_gui.conflict]
body = "設定 GUI を開いている間に、次の項目が設定ファイルでも変わりました。GUI でも変えています。"
choices = "OK: GUI の値で上書きする\nキャンセル: 適用をやめる（設定ファイルは変えません）"

[settings_gui.tab]
capture = "キャプチャ"

[settings_gui.capture]
select_capture = "範囲選択キャプチャ:"
hint = "欄を選んでキーを押すと割り当てます。Tab で次の欄へ移ります。"

# 欄の横の印
[settings_gui.mark]
unset = "未設定"
conflict = "重なっています"
mouse_conflict = "重なっています"
overlap = "ショートカットと重なっています（ホットキーが優先）"
not_registered = "登録できませんでした（他のアプリが使っている可能性があります）"
empty_name = "名前が空です"
duplicate_name = "名前が重なっています"

[hotkey]
failed = "次のホットキーを登録できませんでした（他のアプリが使っている可能性があります）: "
unset = "範囲選択キャプチャのホットキーが未設定です。設定ファイルの [hotkeys] の select_capture に書いてください（トレイからも撮れます）。"

# スクラップ操作（右クリックメニュー）。キーは scrap::ops の表の label_key
[scrap.op]
copy = "コピー"
save_default = "既定の保存先へ保存"
save_as = "保存先を確認して保存"
trim = "トリム"
untrim = "トリムを解除"
annotate = "書き込み"
move = "移動"
move_left = "左へ移動（1px）"
move_right = "右へ移動（1px）"
move_up = "上へ移動（1px）"
move_down = "下へ移動（1px）"
move_left_10 = "左へ移動（10px）"
move_right_10 = "右へ移動（10px）"
move_up_10 = "上へ移動（10px）"
move_down_10 = "下へ移動（10px）"
zoom = "拡大縮小"
zoom_in = "拡大"
zoom_out = "縮小"
zoom_actual = "元のサイズに戻す"
appearance = "見た目"
opacity = "透明度"
opacity_up = "濃くする"
opacity_down = "薄くする"
border = "枠"
shadow = "影"
toggle_compact = "コンパクト表示"
close = "閉じる"

# 枠の一覧（scrap::ops の border の選択肢）
[scrap.border]
none = "なし"
default = "既定の色"
gray = "灰"
black = "黒"
white = "白"
red = "赤"
blue = "青"

# 影の一覧（scrap::ops の shadow の選択肢）
[scrap.shadow]
on = "あり"
off = "なし"

# 裏のスレッドのパニック（その仕事の失敗の理由として出す）
[job]
panicked = "予期しないエラーが起きました。詳しくはログを見てください。"

[capture]
failed = "画面を撮れませんでした。"
# ウィンドウを WGC で撮れず（UAC で昇格したウィンドウなど）、見えている部分だけを撮ったとき
window_partial = "隠れた部分は撮れませんでした。"

# 定型領域キャプチャの失敗。後ろに定型領域の名前を付けて出す
[region]
monitor_not_found = "定型領域のモニタが見つからないため、撮れませんでした: "
out_of_bounds = "定型領域の範囲がモニタからはみ出すため、撮れませんでした: "
gone = "その名前の定型領域が設定にないため、撮れませんでした: "
# 定型領域の登録。登録した名前は「領域 1」「領域 2」…（この後ろに番号を付ける）
default_name = "領域"
registered = "定型領域を登録しました: "
register_failed = "定型領域を登録できませんでした。"
# 範囲選択の画面
[selection]
# 定型領域の登録のとき、画面の上端に出す
register_banner = "定型領域の登録"

# CLI（shunsoku-cli）に返す失敗の理由。標準エラーに出る
[cli]
selecting = "範囲選択の画面を開いているため、撮れません。"
no_such_monitor = "その番号のモニタはありません（番号は shunsoku-cli monitors で調べられます）: "
no_main_monitor = "メインモニタが見つかりません。"
out_of_monitor = "範囲がモニタからはみ出しています。"
unreadable_monitor = "このモニタの画面はそのまま出せません（回転したモニタなど）。"
cancelled = "範囲選択が取り消されました。"
timed_out = "時間内に撮り終えられなかったため、依頼を取りやめました。"
no_active_window = "撮れるアクティブウィンドウがありません（デスクトップとタスクバーは撮りません）。"

[copy]
failed = "クリップボードにコピーできませんでした。"

[trash]
restore_failed = "ごみ箱から戻せませんでした。"

[save]
saved = "保存しました（クリックでフォルダを開きます）:"
failed = "保存できませんでした。スクラップは残っています。"
# 「名前を付けて保存」のファイルの種類
png_filter = "PNG 画像"
