pick_color = "選ぶ…"
transparent = "透明"
# キーの組み合わせの欄が空のときに出す文字（標準のコントロールに任せると OS の表示言語で出る）
chord_none = "なし"
insert_variable = "変数を挿入"

# 適用で、設定 GUI を開いている間に設定ファイルでも変わった項目を GUI でも変えていたときの確認

# 読めない入力で欄を元に戻したときに、欄に出す吹き出し
[settings_gui.invalid]
title = "この値は使えません"
number = "{min} から {max} までの整数を入れてください。欄は元の値に戻しました。"
number_min = "{min} 以上の整数を入れてください。欄は元の値に戻しました。"
