# shunsoku の設定ファイルのサンプル
#
# 置き場所: %APPDATA%\shunsoku\settings.toml
#   （エクスプローラーのアドレス欄に %APPDATA%\shunsoku と入れると開けます）
# このファイルをその名前でコピーし、変えたい項目だけを書き換えてください。
# 保存すると、再起動しなくてもすぐに反映されます。
#
# - 書かなかった項目と、行頭に # を付けた（コメントにした）項目は既定値になります。
#   このサンプルの値はすべて既定値です。
# - 値が正しくない項目は、その項目だけ既定値になり、通知で項目名を知らせます。
# - ファイル全体が TOML として読めないときは、直前の設定のまま動き続けます（起動時ならすべて既定値）。

# 設定ファイルの形式の版。必須で、1 だけを書けます。消したり変えたりしないでください。
version = 1

# ログ（%APPDATA%\shunsoku\shunsoku.log）に書く細かさ。不具合を調べるとき用の隠し項目です。
# off / error / warn / info / debug / trace のどれか。
log_level = "info"

[general]
# メニュー・通知・設定 GUI・範囲選択の画面の言語。次のどれか（コマンドライン（shunsoku-cli）は日本語のままです）。
#   auto  OS の表示言語に合わせる（日本語でなければ英語）
#   ja    日本語
#   en    英語（English）
language = "auto"

# 「既定の保存先へ保存」で画像を保存するフォルダ。絶対パスだけを書けます（C:\… か \\サーバー\共有\…）。
# 既定はピクチャ フォルダの下の shunsoku。
# バックスラッシュをそのまま書けるよう、' ' で囲んでください。
# save_dir = 'D:\shots'

# 保存する画像のファイル名（拡張子 .png は自動で付きます）。空にはできません。使える変数:
#   {date}             日付 yyyyMMdd（例: 20261101）
#   {time}             時刻 HHmmss（例: 153045）
#   {datetime:<書式>}  書式の yyyy（年 4 桁）yy MM dd HH mm ss fff（ミリ秒）を置き換え、ほかの文字はそのまま
#                      （例: {datetime:yyyy-MM-dd_HH.mm.ss}）
#   {seq} / {seq:N}    連番（N 桁にゼロ埋め）。保存先フォルダの同じテンプレートの名前の最大の番号 + 1
#   {name}             定型領域の名前（範囲選択キャプチャでは空）
# 知らない変数はそのまま残ります。ファイル名に使えない文字（<>:"/\|?* など）は _ に置き換えます。
# 同じ名前のファイルがあれば _2、_3 … を付けて上書きを避けます。
file_name_template = "shunsoku_{date}-{time}"

# 通知を出すかどうか（true / false）。false で止まるのは成功の通知（保存しました など）だけで、
# エラーと警告は常に出します。
notifications = true

# ごみ箱（閉じたスクラップを預かり、トレイメニューの「ごみ箱」から戻せる）に残す数。0〜100 の整数。
# 超えたら古いものから消えます。0 なら閉じたらすぐに破棄します。終了するとごみ箱は空になります。
trash_limit = 10

# DPI（拡大率）の違うモニタへスクラップを動かしたときの見え方。次のどちらか。
#   keep_pixels         画素を等倍に保つ。画面上の画素数は変わらず、見かけの大きさが変わる
#   keep_apparent_size  見かけの大きさを保つ。移動先の DPI に合わせて倍率を変える
dpi_scaling = "keep_pixels"

# キャプチャにマウスカーソルを写すかどうか（true / false）。範囲選択・ウィンドウ・定型領域・コマンドラインの
# すべての撮り方に効きます。
capture_cursor = false

[hotkeys]
# 範囲選択キャプチャを呼び出すホットキー。既定は未設定（"" も未設定）なので、使うには下の行の # を外して
# 好きなキーにしてください。
# キーの書き方:
#   修飾キー（Win / Ctrl / Alt / Shift）とキー 1 つを + でつなぎます（例: "Ctrl+Shift+A"）。
#   大文字と小文字は区別しません。修飾キーなしでも書けます（例: "PrintScreen"）。
#   キー: A〜Z、0〜9、F1〜F24、Numpad0〜Numpad9、
#         Backspace Tab Enter Pause Esc Space PageUp PageDown End Home Left Up Right Down
#         PrintScreen Insert Delete NumpadMultiply NumpadAdd NumpadSubtract NumpadDecimal
#         NumpadDivide Plus Comma Minus Period
# OS やほかのアプリが使っている組み合わせは登録できず、通知で知らせます。
# select_capture = "Ctrl+Shift+A"

# 最後に閉じたスクラップをごみ箱から復元するホットキー。既定は未設定（"" も未設定）で、書かなくても
# 通知は出ません。書き方は select_capture と同じです。範囲選択の画面を開いている間は効きません。
# Ctrl+Shift+Z にすると、書き込みの編集モードのやり直し（Ctrl+Shift+Z）よりもこのホットキーが先にキーを
# 取ります。そのときは、やり直しに Ctrl+Y を使ってください。
# restore_last = "Ctrl+Alt+Z"

# いまアクティブなウィンドウを撮って、スクラップとして表示するホットキー（ウィンドウキャプチャ）。
# 他のウィンドウに隠れた部分も撮れます。既定は未設定（"" も未設定）で、書かなくても通知は出ません。
# 書き方は select_capture と同じです。範囲選択の画面を開いている間は効きません。
# active_window_capture = "Ctrl+Shift+W"

[shortcuts]
# スクラップにフォーカスがあるときのショートカットを、スクラップ操作の id ごとに上書きします。
# 書き方は [hotkeys] と同じです。書いた 1 つが既定のショートカットを全部置き換えます。
# "" と書くと、その操作のショートカットを外します。書かなかった操作は既定のままです。
# 同じキーを 2 つ以上の操作に書くと、どの操作にも付かず、通知で知らせます。
# 表にない id は無視して通知で知らせます。
#
# id              操作（右クリックメニューの名前）  既定のショートカット
# copy            コピー                            Ctrl+C
# save_default    既定の保存先へ保存                Ctrl+S
# save_as         保存先を確認して保存              Ctrl+Shift+S
# trim            トリム                            Ctrl+T
# untrim          トリムを解除                      （なし）
# annotate        書き込み                          E
# move_left       左へ移動（1px）                   Left
# move_right      右へ移動（1px）                   Right
# move_up         上へ移動（1px）                   Up
# move_down       下へ移動（1px）                   Down
# move_left_10    左へ移動（10px）                  Shift+Left
# move_right_10   右へ移動（10px）                  Shift+Right
# move_up_10      上へ移動（10px）                  Shift+Up
# move_down_10    下へ移動（10px）                  Shift+Down
# zoom_in         拡大                              Ctrl+Plus、Ctrl+Shift+Plus、Ctrl+NumpadAdd
#                                                   （マウスのホイールを上へでも拡大します）
# zoom_out        縮小                              Ctrl+Minus、Ctrl+NumpadSubtract
#                                                   （マウスのホイールを下へでも縮小します）
# zoom_actual     元のサイズに戻す                  Ctrl+0
# opacity_up      濃くする                          （なし。Ctrl+ホイールを上へで濃くします）
# opacity_down    薄くする                          （なし。Ctrl+ホイールを下へで薄くします）
# toggle_compact  コンパクト表示                    （なし。ダブルクリックで切り替えます）
# close           閉じる                            Esc（マウスの中クリックでも閉じます）
# （ドラッグでの移動はマウスだけの操作で、ショートカットは付けられません。右クリックメニューの
#   「拡大縮小」「見た目」の一覧から選ぶ操作にも付けられません）
#
# 例:
# copy = "Ctrl+Shift+C"
# close = ""

[mouse]
# スクラップの上でのマウスの操作の割り当てを、スクラップ操作の id ごとに上書きします。
# 値は次のどれか 1 つです（大文字と小文字は区別しません）:
#   WheelUp / WheelDown             ホイールを上 / 下へ
#   Ctrl+WheelUp / Ctrl+WheelDown   Ctrl を押しながらホイールを上 / 下へ
#   MiddleClick                     中クリック
#   DoubleClick                     左ボタンのダブルクリック
# "" と書くと、その操作のマウスの割り当てを外します。書かなかった操作は既定のままです。
# ホイールの上と下は別々に割り当てます（入れ替えるなら上と下の両方を書きます）。
# 同じマウスの操作を 2 つ以上の操作に付けると（既定の割り当てと重なった場合も）、どの操作にも付かず、
# 通知で知らせます。表にない id、値の候補にない名前は無視して通知で知らせます。
# ドラッグでの移動（左ドラッグ）は変えられません。
#
# id              操作                        既定のマウスの操作
# zoom_in         拡大                        WheelUp
# zoom_out        縮小                        WheelDown
# opacity_up      濃くする                    Ctrl+WheelUp
# opacity_down    薄くする                    Ctrl+WheelDown
# toggle_compact  コンパクト表示              DoubleClick
# close           閉じる                      MiddleClick
# （ほかの引数のない操作、たとえば copy や save_default にも割り当てられます）
#
# 例（ダブルクリックと中クリックを入れ替える）:
# close = "DoubleClick"
# toggle_compact = "MiddleClick"

[scrap]
# 新しく作るスクラップの見た目。
# 透明度（%）。10〜100 の整数で、100 で不透明。
opacity = 100
# 枠を出すかどうか（true / false）。
border = true
# 枠の太さ（px）。1〜16 の整数。
border_width = 1
# 枠の色。"#RRGGBB" の形で書きます。
border_color = "#808080"
# 影を出すかどうか（true / false）。
shadow = true

[annotation]
# 書き込み（スクラップの上に描き加える図形や文字）の既定値。書き込みの編集モード（スクラップ操作「書き込み」、
# 既定のショートカットは E）で新しく描くものに使います。描いた書き込みは、あとで変えても変わりません。
# 編集モードの間は、数字キーで道具を選びます（1 矩形、2 楕円、3 矢印、4 線、5 文字、6 フリーハンド。
# 割り当て直せません）。Shift を押しながら描くと、矩形は正方形、楕円は円、線と矢印は 45° 刻みになります。
# V で選択の道具になり、書き込みをクリックして選び直せます。選んだ書き込みはドラッグか矢印キー（Shift で 10
# 画素ずつ）で動かし、Delete か Backspace で消します。選んだまま色や太さを選ぶと、その書き込みも変わります。
# Ctrl+Z で元に戻し、Ctrl+Y か Ctrl+Shift+Z でやり直します（ツールバーのボタンでも）。履歴はスクラップごとに
# 残り、編集モードを抜けても、閉じてごみ箱から戻しても消えません。
# 色。"#RRGGBB" の形で書きます。
color = "#E53935"
# 太さ。1〜64 の整数で、画像の画素で数えます（拡大縮小すると一緒に太く・細くなります）。
width = 3
# 文字の道具（5）は、クリックした所から文字を打ちます（日本語入力も使えます）。Enter で改行し、外をクリックするか
# Esc で確定します（Esc は文字を打っている間は確定だけで、編集モードは抜けません）。何も打たなければ何も残りません。
# 文字を打つ間は、ツールバーの太さの欄が文字の大きさ（12・16・24・32）になります。描いた文字はダブルクリックで
# 打ち直せます。背景や折り返しはありません。
# 文字の大きさ。1〜256 の整数で、画像の画素で数えます。
font_size = 16
# 文字の書体の名前。入っていない書体を書いたときは、Windows が代わりの書体で描きます。描いた文字は、描いたときの
# 書体と大きさのままで、あとで変えても変わりません。
font = "Yu Gothic UI"

[selection]
# 範囲選択の画面。
# 開いたときのモード。次のどちらか。範囲選択の画面で Tab を押すと切り替わります（その回だけ）。
#   normal   通常モード。ドラッグを離した時点で撮る
#   precise  精密モード。離したあと、つまみ・ドラッグ・矢印で範囲を調整し、Enter かダブルクリックで撮る
mode = "normal"
# 通常モードでも十字線を出すかどうか（true / false）。精密モードでは常に出します。
crosshair = false

# 定型領域（毎回同じ場所を撮る範囲）。[[regions]] を 1 つ書くごとに 1 つ増えます。既定はなし。
# トレイメニューの「定型領域」から、ここに書いた順に選んで撮れます。ホットキーでも撮れます。
#   name                名前。必須で、ほかの定型領域と同じ名前にはできません
#   hotkey              撮るホットキー。書き方は [hotkeys] と同じ。省略か "" で未設定
#   monitor             撮るモニタの識別子。必須（登録の画面が書きます）。並びを変えても同じモニタを指します
#   x / y               範囲の左上。モニタの左上からの物理ピクセル。必須で、0 以上
#   width / height      範囲の幅と高さ（物理ピクセル）。必須で、1 以上
#   save_dir            保存するフォルダ。省略すると [general] の save_dir。なければ作ります
#   file_name_template  ファイル名。使える変数は [general] と同じ。既定は "{name}_{date}-{time}"
#   save                保存するかどうか（true / false）。既定は true
#   scrap               撮った範囲の真上にスクラップとして表示するかどうか。既定は false
#                       （フォーカスは元のアプリに残ります。保存できなかったときも表示します）
# save と scrap の両方を false にはできません（save を true として扱います）。
# モニタがないときと、範囲がモニタからはみ出すときは、撮らずに通知で知らせます。
#
# 例:
# [[regions]]
# name = "ダッシュボード"
# hotkey = "Ctrl+Alt+1"
# monitor = '\\?\DISPLAY#GSM5B08#5&1a2b3c4d&0&UID4352#{e6f07b5f-ee97-4a90-b076-33f57bf4eaa7}'
# x = 0
# y = 0
# width = 800
# height = 600
# save_dir = 'D:\shots\dashboard'
# file_name_template = "{name}_{date}-{time}"
# save = true
# scrap = false
