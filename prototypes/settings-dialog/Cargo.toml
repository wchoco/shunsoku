[package]
name = "settings-dialog"
version = "0.1.0"
edition = "2024"
publish = false
description = "Throwaway prototype for ADR-0004 (#38): modeless DIALOGEX + PMv2 + subclassed hot key control"

# Stand-alone: not part of any workspace.
[workspace]

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
